<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            height: 100vh;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #34495e;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        li:hover {
            background-color: #4a5f7f;
        }
    </style>
</head>
<body>
    <h2>📋 메뉴</h2>
    <ul>
        <li>홈</li>
        <li>소개</li>
        <li>프로젝트</li>
        <li>연락처</li>
        <li>설정</li>
    </ul>
</body>
</html>
